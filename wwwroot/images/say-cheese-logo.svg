<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="sayCheeseShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFC928"/>
      <stop offset="100%" stop-color="#F29314"/>
    </linearGradient>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#C0221A"/>
    </linearGradient>
  </defs>

  <!-- Tomato Accent Left -->
  <g transform="translate(14, 30)">
    <!-- Basil leaves -->
    <path d="M 12 0 C 8 -10, 0 -6, 2 0 C 4 6, 10 4, 12 0 Z" fill="#2E7D32" />
    <path d="M 14 -2 C 22 -8, 24 2, 16 2 C 12 2, 12 -2, 14 -2 Z" fill="#4CAF50" />
    <!-- Tomato body -->
    <circle cx="10" cy="12" r="10" fill="url(#tomatoGrad)" />
    <circle cx="20" cy="15" r="7" fill="url(#tomatoGrad)" opacity="0.9" />
    <ellipse cx="8" cy="8" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 8 8)" />
  </g>

  <!-- SAY Text (White chunky with dark stroke and drop shadow) -->
  <text x="75" y="44" 
        font-family="'Fredoka', 'Titan One', 'Impact', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="2"
        fill="#FFFFFF" 
        stroke="#1E0704" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#sayCheeseShadow)"
        paint-order="stroke fill">
    SAY
  </text>

  <!-- Smiling Crescent Mouth Arc (Above CHEESE, exactly like references) -->
  <g transform="translate(195, 22)">
    <!-- White smile crescent -->
    <path d="M 0 10 Q 30 32, 60 10 Q 30 18, 0 10 Z" 
          fill="#FFFFFF" 
          stroke="#1E0704" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#sayCheeseShadow)"/>
    <!-- Left dimple -->
    <circle cx="-1" cy="9" r="3.2" fill="#FFFFFF" stroke="#1E0704" stroke-width="2" />
    <!-- Right dimple -->
    <circle cx="61" cy="9" r="3.2" fill="#FFFFFF" stroke="#1E0704" stroke-width="2" />
  </g>

  <!-- CHEESE Text (Golden cheese yellow with heavy dark outline) -->
  <text x="32" y="96" 
        font-family="'Fredoka', 'Titan One', 'Impact', sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="2.5"
        fill="url(#cheeseGrad)" 
        stroke="#1E0704" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#sayCheeseShadow)"
        paint-order="stroke fill">
    CHEESE
  </text>

  <!-- PIZZA subtext (Artisan script red) -->
  <text x="210" y="112" 
        font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" 
        font-size="22" 
        font-weight="700" 
        font-style="italic"
        fill="#FF6B4A" 
        stroke="#1E0704" 
        stroke-width="2"
        paint-order="stroke fill">
    Pizza
  </text>
</svg>
